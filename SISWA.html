<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Shalat Dzuhur Siswa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HTML5 QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="h-full text-slate-800 flex flex-col justify-between max-w-md mx-auto bg-white shadow-xl min-h-screen">

    <!-- Mobile Header -->
    <header class="bg-emerald-600 text-white p-5 text-center rounded-b-3xl shadow-md">
        <i class="fa-solid fa-mosque text-3xl mb-1 text-emerald-200"></i>
        <h1 class="font-bold text-lg">Absensi Shalat Dzuhur</h1>
        <p class="text-xs text-emerald-100">Scan QR Code Masjid untuk Presensi</p>
    </header>

    <!-- Main Content Body -->
    <main class="p-6 flex-1 flex flex-col justify-center items-center">
        
        <!-- Step 1: Camera Scanner -->
        <div id="scanner-step" class="w-full space-y-4 text-center">
            <div class="relative overflow-hidden rounded-2xl border-4 border-emerald-500 bg-slate-900 shadow-inner">
                <div id="reader" class="w-full"></div>
            </div>
            <p class="text-xs text-slate-500"><i class="fa-solid fa-camera mr-1"></i> Arahkan kamera ke QR Code Utama Masjid</p>
            
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-xs text-slate-400 uppercase font-semibold">Atau</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Manual NIS Fallback -->
            <div class="space-y-2">
                <input type="text" id="manual-nis-input" placeholder="Masukkan NIS Siswa" class="w-full px-4 py-3 border rounded-xl text-center text-sm font-mono focus:ring-2 focus:ring-emerald-500 outline-none">
                <button onclick="handleManualNIS()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm transition">Cari NIS Saya</button>
            </div>
        </div>

        <!-- Step 2: Confirm Student & Status -->
        <div id="confirm-step" class="w-full space-y-5 hidden">
            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 text-center">
                <span class="text-xs uppercase font-semibold text-emerald-600 tracking-wider">Identitas Siswa</span>
                <h3 id="student-name-display" class="font-extrabold text-lg text-slate-800 mt-1">-</h3>
                <p id="student-info-display" class="text-xs text-slate-500 font-mono mt-0.5">-</p>
            </div>

            <div class="space-y-3">
                <label class="block text-xs font-semibold text-slate-600 uppercase text-center">Pilih Status Shalat Dzuhur</label>
                <button onclick="submitAttendance('Berjamaah')" class="w-full bg-emerald-600 text-white font-semibold py-3.5 rounded-xl shadow-md hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-users"></i> Shalat Berjamaah
                </button>
                <button onclick="submitAttendance('Munfarid')" class="w-full bg-blue-600 text-white font-semibold py-3.5 rounded-xl shadow-md hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user"></i> Shalat Munfarid (Sendiri)
                </button>
                <button onclick="submitAttendance('Berhalangan')" class="w-full bg-amber-500 text-white font-semibold py-3.5 rounded-xl shadow-md hover:bg-amber-600 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-hand"></i> Berhalangan (Haiz / Sakit)
                </button>
            </div>

            <button onclick="resetStep()" class="w-full text-xs text-slate-400 py-2">Batal / Kembali Scan</button>
        </div>

        <!-- Step 3: Success Screen -->
        <div id="success-step" class="w-full text-center space-y-4 hidden">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="font-bold text-xl text-slate-800">Presensi Berhasil!</h2>
            <p class="text-xs text-slate-500">Data presensi Shalat Dzuhur Anda telah tersimpan secara otomatis di sistem.</p>
            <button onclick="resetStep()" class="mt-4 bg-emerald-600 text-white px-6 py-2.5 rounded-xl font-semibold text-xs transition shadow">Absen Kembali</button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-slate-400 border-t">
        Sim-Dzuhur Student Portal &copy; 2026
    </footer>

    <!-- Script Portal Siswa -->
    <script>
        let selectedStudent = null;
        let html5QrcodeScanner = null;

        // Start QR Camera Scanner
        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            if (decodedText === "MASJID_DZUHUR_SESSION_ACTIVE") {
                html5QrcodeScanner.clear();
                promptNISInput();
            }
        }

        function promptNISInput() {
            const nis = prompt("QR Masjid Terverifikasi! Silakan Masukkan NIS Anda:");
            if (nis) {
                findAndSelectStudent(nis);
            } else {
                initScanner();
            }
        }

        function handleManualNIS() {
            const nis = document.getElementById('manual-nis-input').value.trim();
            if (!nis) return alert('Silakan isi NIS Anda!');
            findAndSelectStudent(nis);
        }

        function findAndSelectStudent(nis) {
            const students = JSON.parse(localStorage.getItem('dzuhur_students')) || [];
            selectedStudent = students.find(s => s.nis === nis);

            if (!selectedStudent) {
                alert('Data NIS tidak ditemukan di database. Pastikan Admin telah mendaftarkan NIS Anda!');
                return;
            }

            document.getElementById('student-name-display').innerText = selectedStudent.nama;
            document.getElementById('student-info-display').innerText = `NIS: ${selectedStudent.nis} | Kelas: ${selectedStudent.kelas}`;

            document.getElementById('scanner-step').classList.add('hidden');
            document.getElementById('confirm-step').classList.remove('hidden');
        }

        function submitAttendance(status) {
            if (!selectedStudent) return;

            const attendance = JSON.parse(localStorage.getItem('dzuhur_attendance')) || [];
            
            const newRecord = {
                nis: selectedStudent.nis,
                nama: selectedStudent.nama,
                kelas: selectedStudent.kelas,
                status: status,
                waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                tanggal: new Date().toLocaleDateString('id-ID'),
                pencatat: 'Mandiri (Scan QR)'
            };

            attendance.unshift(newRecord);
            localStorage.setItem('dzuhur_attendance', JSON.stringify(attendance));

            document.getElementById('confirm-step').classList.add('hidden');
            document.getElementById('success-step').classList.remove('hidden');
        }

        function resetStep() {
            selectedStudent = null;
            document.getElementById('manual-nis-input').value = '';
            document.getElementById('success-step').classList.add('hidden');
            document.getElementById('confirm-step').classList.add('hidden');
            document.getElementById('scanner-step').classList.remove('hidden');
            initScanner();
        }

        // Init scanner on page load
        window.onload = initScanner;
    </script>
</body>
</html>
